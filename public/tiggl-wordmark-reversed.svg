  <title id="title">Tiggl reversed wordmark</title>
  <desc id="desc">The Tiggl mark followed by the Tiggl name in cream for dark backgrounds.</desc>
  <g transform="translate(10 10) scale(.78125)">
    <rect width="256" height="256" rx="52" fill="#FFFFFF"/>
    <circle cx="128" cy="128" r="45" fill="#0077FF" stroke="#030304" stroke-width="14"/>
  </g>
  <text x="246" y="150" fill="#030304" font-family="'Source Serif 4', Georgia, serif" font-size="132" font-weight="700" letter-spacing="-5">Tiggl</text>
  <circle cx="593" cy="130" r="15" fill="#0077FF"/>
</svg>
